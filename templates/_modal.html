    <div class="modal-box">
        <button class="modal-close" id="modal-close" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18"/>

        <div class="modal-scroll">
            <div class="modal-window-header" id="modal-header">
                <!-- 动态填充 -->
            </div>
            <div id="modal-body">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>
</div>

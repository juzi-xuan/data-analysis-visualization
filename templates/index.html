<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>校园食堂 · 口碑指南</title>

    <!-- 学生端公共外壳：设计令牌 / 顶栏 / 侧栏 / 弹窗 -->
    <link rel="stylesheet" href="/static/css/shell.css">

    <style>
        /* ==========================================================
           首页专属样式（公共部分都在 shell.css 里）
           ========================================================== */

        /* 首页顶部大图
           想换成自己的图片：把图片存成 static/images/hero-canteen.jpg 即可，
           不用改任何代码。图片不存在时会显示暖色渐变兜底 —— 因为是 CSS 背景图，
           不会出现裂图图标。
           （注意：目录里原有的 hero.jpg 是一张无关的湖景照片，没有用它）
        */
        :root {
            --hero-img: url("/static/images/hero-canteen.jpg");
        }

        /* ================= 模块 1：Hero ================= */
        .hero {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-card);
            min-height: 250px;
            display: flex;
            align-items: center;
            padding: 32px;
            /* 无图兜底：暖棕 → 橙，保证白字对比度达标 */
            background: linear-gradient(120deg, #7C2D12 0%, #9A3412 58%, #C2410C 100%);
        }
        .hero-media {
            position: absolute;
            inset: 0;
            background-image: var(--hero-img);
            background-size: cover;
            background-position: center;
        }
        /* 图片上的压暗遮罩：保证任何图片下白字都能看清 */
        .hero-media::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                        rgba(30, 14, 5, .42) 0%,
                        rgba(30, 14, 5, .24) 58%,
                        rgba(30, 14, 5, .10) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 46%;
            color: #fff;
            align-self: flex-end;
            margin-bottom: 4px;
        }
        .hero-content h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: .01em;
        }
        .hero-content p {
            margin-top: 6px;
            font-size: 13.5px;
            color: rgba(255, 255, 255, .86);
        }
        .hero-cta {
            margin-top: 22px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 42px;
            padding: 0 22px;
            border: 0;
            border-radius: 999px;
            background: var(--primary-strong);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .18s, transform .18s;
        }
        .hero-cta:hover { background: #A9360F; transform: translateY(-1px); }
        .hero-cta:active { transform: translateY(0); }
        .hero-cta svg { width: 16px; height: 16px; }

        /* ---------- 随机推荐卡片（只一张） ---------- */
        .hero-card {
            position: absolute;
            right: 32px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 220px;
            padding: 14px;
            background: var(--card);
            border-radius: var(--radius-card);
            box-shadow: 0 10px 30px rgba(28, 12, 4, .28);
        }
        .pick-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* flex 子项默认 min-width:auto，不设为 0 的话
           里面的长菜名不会出现省略号，而是把卡片撑变形 */
        .pick-info { min-width: 0; }
        .pick-thumb { width: 46px; height: 46px; font-size: 17px; }

        .pick-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pick-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
            font-size: 12.5px;
            color: var(--fg-subtle);
        }
        .pick-rating b {
            color: var(--fg);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .pick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .tag {
            padding: 3px 9px;
            border-radius: var(--radius-sm);
            background: #F6F1EA;
            color: var(--fg-muted);
            font-size: 11.5px;
            font-weight: 500;
            white-space: nowrap;
        }
        .tag-price {
            background: var(--primary-soft);
            color: var(--primary-strong);
            font-variant-numeric: tabular-nums;
        }

        .pick-reason {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--divider);
            font-size: 12.5px;
            color: var(--fg-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pick-window {
            margin-top: 6px;
            font-size: 11.5px;
            color: var(--fg-subtle);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ================= 模块 2：人气榜 ================= */
        /* 纯展示的排行榜，不可点击 —— 窗口详情在「窗口口碑」页 */
        .rank-list { display: flex; flex-direction: column; }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 8px;
            border-top: 1px solid var(--divider);
        }
        .rank-row:first-child { border-top: 0; }

        .rank-no {
            flex: 0 0 26px;
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            background: #F3EDE6;
            color: #8A8078;
        }
        /* 前三名：只换底色和文字色，不用金银铜渐变 */
        .rank-no.n1 { background: var(--primary-soft); color: var(--primary-strong); }
        .rank-no.n2 { background: #F1F1F3; color: #5B6472; }
        .rank-no.n3 { background: #FBF0E4; color: #95611F; }

        .rank-thumb { width: 44px; height: 44px; font-size: 16px; }

        .rank-main { flex: 1 1 auto; min-width: 0; }
        .rank-name {
            /* 行内是 span，必须显式设成 block 才会换行 */
            display: block;
            font-size: 14.5px;
            font-weight: 600;
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rank-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
            font-size: 12.5px;
            color: var(--fg-subtle);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rank-meta .i-star { width: 11px; height: 11px; }
        .rank-meta b {
            color: var(--fg-muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .rank-votes {
            flex: 0 0 auto;
            font-size: 12.5px;
            color: var(--fg-subtle);
            white-space: nowrap;
        }
        .rank-votes b {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-strong);
            font-variant-numeric: tabular-nums;
        }

        /* ================= 模块 3：底部问卷 CTA ================= */
        .cta-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            background: var(--primary-soft);
            border-radius: var(--radius-card);
        }
        .cta-banner p {
            font-size: 13.5px;
            color: #8A4B22;
        }
        .cta-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            padding: 9px 18px;
            border-radius: 999px;
            background: var(--primary-strong);
            color: #fff;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            transition: background .18s, transform .18s;
        }
        .cta-link:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .cta-link svg { width: 14px; height: 14px; }

        /* ================= 响应式 ================= */
        @media (max-width: 640px) {
            .hero {
                flex-direction: column;
                align-items: stretch;
                min-height: 0;
                padding: 24px 20px;
            }
            .hero-content { max-width: none; }
            .hero-content h1 { font-size: 24px; }
            .hero-card {
                position: static;
                transform: none;
                width: 100%;
                /* flex 子项默认 min-width:auto 会取内容最小宽度，
                   卡片里有 white-space:nowrap 的长文字，
                   不设 0 的话卡片撑不回去，会把整页顶出横向滚动条 */
                min-width: 0;
                margin-top: 20px;
                box-shadow: none;
            }
            .rank-votes { display: none; }
            .cta-banner {
                flex-direction: column;
                align-items: stretch;
            }
            .cta-link { justify-content: center; }
        }

        @media (max-width: 480px) {
            .hero { padding: 20px 16px; min-height: 260px; }
            /* 图片右移，让左边的「今天吃什么？」完整露出来 */
            .hero-media { background-position: left center; }
            .hero-content h1 { font-size: 22px; }
            .hero-content p { font-size: 13px; }
            .hero-cta {
                height: 46px; padding: 0 24px; font-size: 14px;
                width: 100%; justify-content: center;
                margin-top: 0;
            }
            .hero-card { margin-top: 60px; }
            .rank-row { padding: 16px; }
            .rank-item { min-width: 0; flex: 1 1 50%; }
        }
    </style>
</head>
<body>

    {% include '_topbar.html' %}

    <div class="app-body">

        {% include '_sidebar.html' %}

        <main class="app-main">

            <!-- ===== 模块 1：Hero + 随机推荐（一个餐食） ===== -->
            <section class="hero">
                <div class="hero-media" aria-hidden="true"></div>

                <div class="hero-content">
                    <button class="hero-cta" id="btn-reroll" type="button">
                        随机推荐
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M5 12h13M12.5 6.5 19 12l-6.5 5.5"/>
                        </svg>
                    </button>
                </div>

                <div class="hero-card" id="recommend-card">
                    <div class="loading-line">正在挑选…</div>
                </div>
            </section>

            <!-- ===== 模块 2：人气榜（排行榜） ===== -->
            <section class="block">
                <div class="block-head">
                    <h2 class="block-title">人气榜</h2>
                    <span class="block-sub">按同学投票数排名</span>
                </div>
                <div class="rank-list" id="rank-list">
                    <div class="loading-line">正在加载人气榜…</div>
                </div>
            </section>

            <!-- ===== 模块 3：问卷 CTA ===== -->
            <section class="cta-banner">
                <p>你的每一条评价，都是同学们的指南</p>
                <a class="cta-link" href="/survey">
                    立即评价
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h13M12.5 6.5 19 12l-6.5 5.5"/>
                    </svg>
                </a>
            </section>

        </main>
    </div>

    <script src="/static/js/shell.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>

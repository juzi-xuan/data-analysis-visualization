{# ---------- 学生端公共顶栏 ----------
   参数：
     search_placeholder  搜索框占位文字（可选）
     search_label        搜索框的无障碍名称（可选）
   注意：搜索框 id 固定为 search-input，各页面的 JS 各自接管它的过滤行为。
#}
<header class="app-topbar">
    <div class="app-topbar-inner">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">
                <!-- 碗 + 热气（内联 SVG，不用 emoji） -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 11h18"/>
                    <path d="M5 11a7 7 0 0 0 14 0"/>
                    <path d="M9.5 7.5c0-1.2.8-1.6 1.2-2.5"/>
                    <path d="M13.5 7.5c0-1.2.8-1.6 1.2-2.5"/>
                </svg>
            </span>
            <span class="brand-name">校园食堂 · 口碑指南</span>
        </a>

        <div class="app-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="M16.5 16.5 21 21"/>
            </svg>
            <label for="search-input" class="sr-only">{{ search_label | default('搜索') }}</label>
            <input id="search-input" type="search" autocomplete="off"
                   placeholder="{{ search_placeholder | default('搜索食堂、窗口、菜品…') }}">
        </div>

        <div class="app-user">
            <span class="app-user-greet">你好,同学</span>
            <span class="app-user-avatar" aria-hidden="true">同</span>
        </div>
    </div>
</header>

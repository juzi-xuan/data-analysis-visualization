{# ---------- 学生端公共顶栏 ----------
   参数：
     search_placeholder  搜索框占位文字（可选）
     search_label        搜索框的无障碍名称（可选）
     nav_active          当前高亮：'home' | 'windows' | 'survey'
#}
<header class="app-topbar">
    <div class="app-topbar-inner">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 11h18"/>
                    <path d="M5 11a7 7 0 0 0 14 0"/>
                    <path d="M9.5 7.5c0-1.2.8-1.6 1.2-2.5"/>
                    <path d="M13.5 7.5c0-1.2.8-1.6 1.2-2.5"/>
                </svg>
            </span>
            <span class="brand-name">校园食堂 · 口碑指南</span>
        </a>

        <div class="app-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <path d="M16.5 16.5 21 21"/>
            </svg>
            <label for="search-input" class="sr-only">{{ search_label | default('搜索') }}</label>
            <input id="search-input" type="search" autocomplete="off"
                   placeholder="{{ search_placeholder | default('搜索食堂、窗口、菜品…') }}">
        </div>

        {# 面包屑下拉（所有页面共用，用 nav_active 高亮当前项） #}
        <div class="app-nav-breadcrumb" id="app-nav-breadcrumb">
            <button class="bc-trigger" id="bc-trigger" aria-label="导航菜单" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="6"  x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <nav class="bc-menu" role="menu">
                <a class="bc-item {% if nav_active == 'home' %}active{% endif %}"
                   href="/" role="menuitem" {% if nav_active == 'home' %}aria-current="page"{% endif %}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9.6V20h13V9.6"/></svg>
                    <span>首页</span>
                </a>
                <a class="bc-item {% if nav_active == 'windows' %}active{% endif %}"
                   href="/windows" role="menuitem" {% if nav_active == 'windows' %}aria-current="page"{% endif %}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5 6 4h12l2.5 5.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>
                    <span>窗口口碑</span>
                </a>
                <a class="bc-item {% if nav_active == 'survey' %}active{% endif %}"
                   href="/survey" role="menuitem" {% if nav_active == 'survey' %}aria-current="page"{% endif %}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16" rx="2"/><path d="M9 3h6v3H9z"/><path d="M9 11h6M9 14.5h6M9 18h3.5"/></svg>
                    <span>调查问卷</span>
                </a>
            </nav>
        </div>
    </div>
</header>

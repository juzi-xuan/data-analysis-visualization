<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>调查问卷 · 校园食堂</title>

    <!-- 加载顺序有讲究：
         style.css → 问卷页原来依赖它的基础样式，先加载
         shell.css → 设计令牌 / 顶栏 / 侧栏，覆盖上面 body 等全局样式
         survey.css → 问卷页自己的组件样式，优先级最高 -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/shell.css">
    <link rel="stylesheet" href="/static/css/survey.css">

    <style>
        /* ==========================================================
           问卷页专属样式（公共部分都在 shell.css 里）
           ========================================================== */

        /* ---------- 顶栏搜索：过滤窗口卡片 ---------- */
        /* 用 !important 只做「加隐藏」，不做「取消隐藏」，
           这样不会和 survey.js 自己的显示/隐藏逻辑打架 */
        .window-card.search-hidden { display: none !important; }

        .search-empty {
            padding: 36px 20px;
            text-align: center;
            font-size: 13px;
            color: var(--fg-subtle);
        }

        /* 卡片网格在 .block 里，把内边距收一点，避免和卡片 padding 叠加过多 */
        .window-cards { padding: 4px 0; }

        @media (max-width: 900px) {
            .window-cards { grid-template-columns: 1fr; }
        }

        /* --- 自定义弹窗里的新样式 --- */
        .custom-store-hint {
            margin-top: 6px;
            padding: 8px 12px;
            font-size: 12.5px;
            border-radius: var(--radius-sm);
            background: #F0F9F1;
            color: #2D8A44;
            line-height: 1.5;
        }
        .custom-store-hint.is-new { background: #FFF4E6; color: #C66A00; }

        /* ---------- 弹窗顶部可点击图片区 ---------- */
        .store-image-hero {
            position: relative;
            width: 100%;
            height: 140px;
            margin-bottom: 16px;
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            background: #FFF4E6;
            border: 2px dashed #E5C9A8;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color .18s, background .18s;
        }
        .store-image-hero:hover {
            border-color: var(--primary-strong);
            background: #FFECDA;
        }
        .store-image-hero__empty {
            text-align: center;
            color: var(--fg-muted);
            pointer-events: none;
        }
        .store-image-hero__emoji {
            display: block;
            font-size: 36px;
            line-height: 1;
            margin-bottom: 6px;
        }
        .store-image-hero__hint {
            display: block;
            font-size: 13px;
        }
        .store-image-hero__img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        /* 有图时叠加半透明蒙层 + 改 hover 状态，暗示"可以重新上传" */
        .store-image-hero.has-image::after {
            content: "📷 点击更换";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity .18s;
            pointer-events: none;
        }
        .store-image-hero.has-image:hover::after { opacity: 1; }

        /* ---------- 全局 Toast 通知 ---------- */
        .app-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            z-index: 9999;
            min-width: 200px;
            max-width: 380px;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transition: opacity .22s ease, transform .22s ease;
            pointer-events: none;
            text-align: center;
        }
        .app-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .app-toast.toast-success { background: #E7F5E9; color: #1E7B34; border: 1px solid #B5E1BD; }
        .app-toast.toast-error   { background: #FDECEC; color: #A12828; border: 1px solid #F0B8B8; }
        .app-toast.toast-info    { background: #E8F1FB; color: #1E4A7B; border: 1px solid #B8D4F0; }
        .app-toast.toast-warn    { background: #FFF4E6; color: #A15C10; border: 1px solid #F0CC8E; }

        /* ---- 弹窗顶部 hero 小屏优化 ---- */
        @media (max-width: 480px) {
            .store-image-hero { height: 100px; margin-bottom: 12px; }
            .store-image-hero__emoji { font-size: 28px; margin-bottom: 4px; }
            .store-image-hero__hint { font-size: 12px; }
        }
    </style>
</head>
<body>

    {% include '_topbar.html' %}

    <div class="app-body">

        {% include '_sidebar.html' %}

        <main class="app-main">

            <!-- 说明条 -->
            <section class="intro">
                <h1>食堂窗口评价问卷</h1>
                <p>请对食堂窗口进行评价，帮助同学选择</p>
                <p class="intro-sub">所有评价都是选填的，吃过哪个评哪个就好～</p>
            </section>

            <!-- 问卷主体 -->
            <section class="block">

                <!-- 食堂分类切换 tab -->
                <div class="canteen-tabs">
                    <button type="button" class="canteen-tab active" data-canteen="all">全部食堂</button>
                    <button type="button" class="canteen-tab" data-canteen="一食堂">一食堂</button>
                    <button type="button" class="canteen-tab" data-canteen="二食堂">二食堂</button>
                    <button type="button" class="canteen-tab" data-canteen="其他">其他</button>
                </div>

                <!-- "其他" tab 专用：添加餐品按钮（默认隐藏，选中"其他"时显示） -->
                <div class="custom-add-bar" id="custom-add-bar" style="display:none;">
                    <button type="button" class="btn btn-primary" id="open-custom-form">
                        ➕ 添加我喜欢的餐品
                    </button>
                </div>

                <form id="survey-form">
                    <!-- JS 动态生成窗口卡片 -->
                    <div id="window-cards" class="window-cards"></div>

                    <!-- 搜索无结果时的提示（由底部脚本控制显隐） -->
                    <div class="search-empty" id="search-empty" hidden>
                        没有找到匹配的窗口，换个关键词试试
                    </div>

                    <!-- 提交按钮区 -->
                    <div class="survey-submit-bar">
                        <button type="button" id="reset-btn" class="btn btn-secondary">🔄 重置所有</button>
                        <button type="submit" id="submit-btn" class="btn btn-primary">📨 提交评价</button>
                    </div>
                </form>

            </section>

        </main>
    </div>

    <!-- 添加餐品弹窗 -->
    <div id="custom-dish-modal" class="modal hidden">
        <div class="modal-content modal-content--custom">
            <span class="img-modal__close" id="custom-modal-close">✕</span>

            <!-- 顶部可点击图片区（上传店子图片入口） -->
            <div class="store-image-hero" id="store-image-hero" title="点击上传店子图片">
                <div class="store-image-hero__empty">
                    <span class="store-image-hero__emoji">🏪</span>
                    <span class="store-image-hero__hint">📷 点击上传店子图片</span>
                </div>
                <img class="store-image-hero__img" id="store-image-hero-img" alt="店子图片" hidden>
            </div>
            <input type="file" accept="image/*" id="custom-store-image-input" hidden>

            <h2>🍽️ 添加一家店的某道菜</h2>
            <p class="custom-form-tip">好的坏的都可以说，其他同学也能看到你的评价和投票～</p>

            <form id="custom-dish-form" enctype="multipart/form-data">
                <div class="custom-form-row">
                    <label>🏪 店名 <span class="required">*</span></label>
                    <input type="text" name="store_name" id="custom-store-name" required placeholder="例如：BT烤翅" maxlength="50" list="existing-stores-list">
                    <datalist id="existing-stores-list"></datalist>
                    <div class="custom-store-hint" id="custom-store-hint" hidden></div>
                </div>
                <div class="custom-form-row">
                    <label>🍜 餐品名 <span class="required">*</span></label>
                    <input type="text" name="dish_name" required placeholder="例如：炒饭 / 烤鱼丸" maxlength="50">
                </div>
                <div class="custom-form-row custom-store-only">
                    <label>📍 地址</label>
                    <input type="text" name="address" placeholder="（选填）方便大家找到" maxlength="100">
                </div>
                <div class="custom-form-row custom-store-only">
                    <label>🎨 菜系类型</label>
                    <select name="cuisine">
                        <option value="其他">其他</option>
                        <option value="面食">面食</option>
                        <option value="盖浇饭">盖浇饭</option>
                        <option value="家常菜">家常菜</option>
                        <option value="小吃快餐">小吃快餐</option>
                        <option value="川菜">川菜</option>
                        <option value="湘菜">湘菜</option>
                        <option value="粤式点心">粤式点心</option>
                        <option value="韩式">韩式</option>
                        <option value="饮品甜品">饮品甜品</option>
                    </select>
                </div>
                <div class="custom-form-row">
                    <label>📝 你的评价</label>
                    <textarea name="description" placeholder="（选填）说说你为什么推荐它..." maxlength="300"></textarea>
                </div>

                <!-- 菜品图上传（保留在表单里，因为一道菜对应一张图） -->
                <div class="custom-form-row">
                    <label>🍽️ 菜品图片（可选）</label>
                    <div class="custom-image-upload">
                        <input type="file" name="image" accept="image/*" id="custom-image-input">
                        <div class="custom-image-preview" id="custom-image-preview" style="display:none;">
                            <img id="custom-preview-img" alt="预览">
                            <button type="button" id="custom-image-remove" class="custom-image-remove">✕ 移除</button>
                        </div>
                    </div>
                </div>

                <!-- 初始评价（可选，发布后你也可以评价它） -->
                <div class="custom-form-section-title">顺便也给这道菜打个分（选填）</div>
                <div class="custom-form-row custom-form-row--rating">
                    <span class="rating-label">满意度：</span>
                    <div class="stars" id="custom-rating-stars" data-window="__custom__">
                        <span class="star" data-score="1">★</span>
                        <span class="star" data-score="2">★</span>
                        <span class="star" data-score="3">★</span>
                        <span class="star" data-score="4">★</span>
                        <span class="star" data-score="5">★</span>
                    </div>
                    <input type="hidden" name="satisfaction" id="custom-satisfaction" value="0">
                </div>
                <div class="custom-form-row custom-form-row--vote">
                    <label>
                        <input type="checkbox" name="voted" value="true">
                        👍 投它一票，帮它上人气榜
                    </label>
                </div>

                <div class="custom-form-actions">
                    <button type="button" id="custom-cancel-btn" class="btn btn-secondary">取消</button>
                    <button type="submit" id="custom-submit-btn" class="btn btn-primary">📣 发布</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 提交成功弹窗 -->
    <div id="success-modal" class="modal hidden">
        <div class="modal-content modal-content--persona">
            <!-- 粒子特效画布 -->
            <canvas id="particle-canvas"></canvas>

            <!-- 感谢文字区 -->
            <div id="success-text-area">
                <div class="modal-icon">✨</div>
                <h2 id="success-title">你的专属人设出炉了！</h2>
                <p class="persona-lead-text">你命中了 <span id="persona-count">1</span> 种食堂人设 ↓</p>
            </div>

            <!-- 多个人设卡片容器 -->
            <div id="persona-cards" class="persona-cards hidden">
                <!-- JS 动态渲染多卡片 -->
            </div>

            <!-- 操作按钮 -->
            <div class="modal-buttons">
                <a href="/" class="btn btn-primary">去看板看数据</a>
                <button type="button" id="modal-close" class="btn btn-secondary">继续评价</button>
            </div>
        </div>
    </div>

    <script src="/static/js/shell.js"></script>
    <script src="/static/js/survey.js"></script>

    <script>
        // ============================================================
        // 顶栏搜索：过滤窗口卡片
        // 这里用 MutationObserver 而不是一次性绑定，是因为 survey.js
        // 每次切换食堂 tab 都会把卡片整个重建一遍（renderWindowCards），
        // 挂在卡片上的过滤会被一起清掉。
        // ============================================================
        (function () {
            var input = document.getElementById("search-input");
            var grid = document.getElementById("window-cards");
            var emptyHint = document.getElementById("search-empty");
            if (!input || !grid) return;

            function applyFilter() {
                var q = input.value.trim().toLowerCase();
                var visible = 0;

                grid.querySelectorAll(".window-card").forEach(function (card) {
                    // 匹配范围：窗口名 + 菜系 + 食堂标签
                    var parts = [];
                    var nameEl = card.querySelector(".window-card__name");
                    var cuisineEl = card.querySelector(".window-card__cuisine");
                    var canteenEl = card.querySelector(".window-card__canteen-tag");
                    if (nameEl) parts.push(nameEl.textContent);
                    if (cuisineEl) parts.push(cuisineEl.textContent);
                    if (canteenEl) parts.push(canteenEl.textContent);

                    var hit = !q || parts.join(" ").toLowerCase().indexOf(q) >= 0;
                    card.classList.toggle("search-hidden", !hit);
                    if (hit) visible++;
                });

                // 只在「有关键词且一条都没匹配上」时给提示，
                // 否则某个食堂本来就空的时候会误报
                if (emptyHint) emptyHint.hidden = !q || visible > 0;
            }

            input.addEventListener("input", applyFilter);
            new MutationObserver(applyFilter).observe(grid, { childList: true, subtree: true });
        })();
    </script>
</body>
</html>
